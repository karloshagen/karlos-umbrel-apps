version: "3.7"

# Project and container names stay off the official "immich_*" app so both can run.
name: karlos-immich

x-environment: &env
  NODE_ENV: "production"
  # Pin the in-container library. v3 detects /data only when /usr/src/app/upload is absent.
  IMMICH_MEDIA_LOCATION: "/data"
  DB_HOSTNAME: "karlos-immich_postgres_1"
  DB_USERNAME: &db_username "immich"
  DB_PASSWORD: &db_password "moneyprintergobrrr"
  DB_DATABASE_NAME: &db_database_name "immich"
  REDIS_HOSTNAME: "karlos-immich_redis_1"
  LOG_LEVEL: "log"
  JWT_SECRET: ${APP_SEED}
  DISABLE_REVERSE_GEOCODING: "false"
  REVERSE_GEOCODING_PRECISION: "3"
  PUBLIC_LOGIN_PAGE_MESSAGE: ""
  IMMICH_MACHINE_LEARNING_URL: "http://karlos-immich_machine-learning_1:3003"

services:
  app_proxy:
    container_name: karlos-immich_app_proxy_1
    environment:
      # Browser port is 2284 (umbrel-app.yml). Immich itself still listens on 2283.
      APP_HOST: karlos-immich_server_1
      APP_PORT: 2283
      PROXY_AUTH_ADD: "false"

  server:
    container_name: karlos-immich_server_1
    image: ghcr.io/immich-app/immich-server:v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
    # Originals stay on the NAS. Thumbnails and transcodes are nested local
    # mounts, which is the layout Immich documents for this split. upload/ and
    # library/ are left on the same NAS mount. create_host_path is off so a
    # missing share is not replaced by an empty local directory.
    volumes:
      - type: bind
        source: ${IMMICH_NAS_LIBRARY:-/home/umbrel/umbrel/network/UNAS-Pro-4.local/Personal-Drive/Photos/Immich}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_DATA_ROOT}/thumbs
        target: /data/thumbs
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_DATA_ROOT}/encoded-video
        target: /data/encoded-video
        bind:
          create_host_path: false
    environment:
      <<: *env
    depends_on:
      - redis
      - postgres
    restart: on-failure

  machine-learning:
    container_name: karlos-immich_machine-learning_1
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.5@sha256:5b28c9352c8374b8a1ed96fbdd8d6755fea6e43510ec43fdf6538aa02ea40f56
    volumes:
      - ${APP_DATA_ROOT}/model-cache:/cache
    environment:
      <<: *env
    restart: on-failure

  redis:
    container_name: karlos-immich_redis_1
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_ROOT}/redis:/data

  postgres:
    container_name: karlos-immich_postgres_1
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:41eacbe83eca995561fe43814fd4891e16e39632806253848efaf04d3c8a8b84
    # new postgres image does not work rootless
    #user: "1000:1000"
    environment:
      <<: *env
      POSTGRES_PASSWORD: *db_password
      POSTGRES_USER: *db_username
      POSTGRES_DB: *db_database_name
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${APP_DATA_ROOT}/postgres:/var/lib/postgresql/data
    restart: on-failure
