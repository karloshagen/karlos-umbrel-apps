manifestVersion: 1.1
id: karlos-immich
storage:
  dataRoot: data
folderAccess:
  - id: external-library
    name: External Library
    note: Select a folder containing photos or videos, then configure /mnt/external-library as an import path for an External Library in Immich. Access is read-only to protect the original files.
    mounts:
      - service: server
        targetPath: /mnt/external-library
        readOnly: true
category: files
name: Immich (NAS)
version: "v3.3.5"
tagline: Immich with originals on your NAS
description: >-
  Immich v3.3.5 with the upload library on the UNAS Personal-Drive share. This is a separate install from the official Umbrel Immich app: its own database, its own port, and its own containers.


  Original photos and videos are stored on the SMB share Umbrel already mounts at /home/umbrel/umbrel/network/UNAS-Pro-4.local/Personal-Drive/Photos/Immich. Postgres, Redis, the machine-learning model cache, thumbnails, and transcoded video stay on this app's local storage.


  ⚠️ Immich is under very active development. Expect bugs and changes. Do not use it as the only way to store your photos and videos!


  Features:

  - Upload and view videos and photos

  - Auto backup when the app is opened

  - Selective album(s) for backup

  - Download photos and videos to a local device

  - Multi-user support

  - Album and Shared albums

  - Scrubbable/draggable scrollbar

  - Support RAW (HEIC, HEIF, DNG, Apple ProRaw)

  - Metadata view (EXIF, map)

  - Search by metadata, objects and image tags

  - Administrative functions (user management)

  - Background backup

  - Virtual scroll

  - OAuth support

  - LivePhoto backup and playback

  - User-defined storage structure
releaseNotes: >-
  First package of Immich v3.3.5 for the Karlos Apps store. The upload library is bind-mounted from the Personal-Drive Photos/Immich folder. Thumbnails (/data/thumbs) and encoded video (/data/encoded-video) use local app storage, which is the split Immich documents for a NAS library. Postgres, Redis, and the ML model cache stay local. The browser port is 2284 so it does not clash with the official Immich app on 2283.


  Upstream notes: https://github.com/immich-app/immich/releases/tag/v3.3.5
developer: Alex Tran
website: https://www.immich.app
dependencies: []
repo: https://github.com/immich-app/immich
support: https://github.com/immich-app/immich/discussions
port: 2284
gallery:
  - https://getumbrel.github.io/umbrel-apps-gallery/immich/1.jpg
  - https://getumbrel.github.io/umbrel-apps-gallery/immich/2.jpg
  - https://getumbrel.github.io/umbrel-apps-gallery/immich/3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - GPU
icon: https://getumbrel.github.io/umbrel-apps-gallery/immich/icon.svg
backupIgnore:
  - data/thumbs
  - data/encoded-video
  - data/model-cache
submitter: karloshagen
